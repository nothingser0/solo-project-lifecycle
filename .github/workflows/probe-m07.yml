name: probe-m07
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI shell runs with -e, so a failing suite killed the step before it could print anything.
      # Capture the status and print the full log regardless.
      - name: Run the regression suite and always print the log
        run: |
          set +e
          bash scripts/verify/test-gate-regressions.sh > /tmp/reg.out 2>&1
          rc=$?
          echo "rc=$rc"
          echo "--- failing cases ---"
          grep -n "✗" /tmp/reg.out | head -20
          echo "--- tail ---"
          tail -25 /tmp/reg.out
          exit 0
