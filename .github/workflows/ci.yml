name: Framework Quality CI

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

jobs:
  bash-validation:
    name: Bash Scripts & Templates Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for fallback package version check)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full framework integrity check (verify-all)
        run: |
          bash scripts/verify/verify-all.sh

      - name: Syntax check Bash scripts (bash -n)
        run: |
          for script in scripts/*/*.sh templates/04-dev-execution/TODO_VERIFICATION_SCRIPT.sh templates/04-dev-execution/scripts/check-dependencies.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Verify CLI template picker dry-run
        run: |
          ./scripts/scaffold/template-picker.sh --phase 8 --dry-run --dest /tmp

      - name: Verify Gate Validation execution
        run: |
          mkdir -p /tmp/mock-project/docs/pm
          cat << 'EOF' > /tmp/mock-project/docs/pm/M00_LITE.md
# M00-Lite: Rapid Market Validation (Solo SaaS & Self-Initiated)

## 1. Project Metadata & Problem Pitch
- **Project Codename**: MockApp
- **Target User**: Independent creators and micro-retail store owners
- **Core Pain**: Time lost tracking receipts and calculating manual reconciliations
- **Proposed Solution**: Automated receipt scanning app with offline sync capability
- **Proposed Price Point**: Rp 150000 / month
- **Validation Lead**: Test Lead
- **Date**: 2026-10-11

## 2. Riskiest Assumption Register (RAT)
| ID | Core Hypothesis | Risk Level | Evidence Needed | Cheap Test Method | Kill Threshold | Outcome |
|:---|:---|:---:|:---|:---|:---|:---:|
| **ASM-01** | Users lose measurable revenue each month | HIGH | 3/5 confirm loss | Deep interviews | <2 respondents | [x] |

## 3. Quick Competitor & Alternative Check
| Solution Name | Type | Price / Tier | Strengths | Critical Weaknesses | Unique Differentiator We Offer |
|:---|:---|:---|:---|:---|:---|
| Competitor X | Direct SaaS | Rp 200k/mo | Established brand | Offline sync broken | 100% offline first sync |

## 4. Qualitative User Discovery
| Respondent ID | Role / Business Type | Current Solution | Biggest Friction / Loss | Willingness to Pay | Evidence Status |
|:---|:---|:---|:---|:---|:---:|
| **INT-01** | Boutique Owner | Paper Receipts | Missing tax deductions | Rp 100k/mo | ✅ Real |
| **INT-02** | Freelancer | Spreadsheet | Formula breakage | Rp 100k/mo | ✅ Real |
| **INT-03** | Agency Founder | SaaS Tool X | Overpriced seat model | Rp 150k/mo | ✅ Real |

## 5. Behavioral Intent Validation
- Total Unique Visitors: 120
- Waitlist-Conversion-Pct: 7.5%

## 7. Kill Criteria & Gate Validation Outcome
Gate-Decision: PASS
EOF
          (cd /tmp/mock-project && "$GITHUB_WORKSPACE/scripts/gates/validate-gate.sh" M00)

      - name: Verify SKILL.md frontmatter
        run: |
          node scripts/verify/verify-skill-frontmatter.js

      - name: Verify Markdown internal links
        run: |
          node scripts/verify/verify-links.js

      - name: Verify ETL importer execution
        run: |
          node scripts/runtime/etl-import.js --source /tmp/mock.csv --dry-run

      - name: Verify package version auto-check
        run: |
          ./scripts/verify/check-package-versions.sh nextjs

      - name: Lint sample PRD template
        run: |
          ./scripts/verify/lint-template.sh templates/03-architecture-specs/PRD_FINAL_TEMPLATE.md

      - name: Validate eval scenario catalog
        run: |
          node scripts/evals/run-evals.js --validate

  powershell-validation:
    name: PowerShell Scripts Tokenization & Execution
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Tokenize PowerShell scripts (PSParser)
        shell: powershell
        run: |
          $files = Get-ChildItem -Path scripts -Recurse -Filter *.ps1
          $hasErrors = $false
          foreach ($f in $files) {
            $errors = $null
            $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content $f.FullName -Raw), [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "[FAIL] $($f.Name): $($errors.Count) errors" -ForegroundColor Red
              $hasErrors = $true
            } else {
              Write-Host "[PASS] $($f.Name)" -ForegroundColor Green
            }
          }
          if ($hasErrors) { exit 1 }

      - name: Verify package version auto-check (PowerShell)
        shell: powershell
        run: |
          .\scripts\verify\check-package-versions.ps1 -Framework nextjs

      - name: Test template picker dry-run
        shell: powershell
        run: |
          .\scripts\scaffold\template-picker.ps1 -Phase 8 -DryRun -Dest "$env:TEMP"

      - name: Test Gate Validation execution (PowerShell)
        shell: powershell
        run: |
          $mockDir = Join-Path $env:TEMP "mock-project-pwsh"
          New-Item -ItemType Directory -Force -Path (Join-Path $mockDir "docs/pm") | Out-Null
          $mockContent = @'
