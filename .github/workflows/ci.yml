| **INT-02** | Freelancer | Spreadsheet | Formula breakage | Rp 100k/mo | ✅ Real |
| **INT-03** | Agency Founder | SaaS Tool X | Overpriced seat model | Rp 150k/mo | ✅ Real |

## 5. Behavioral Intent Validation
- Total Unique Visitors: 120
- Waitlist-Conversion-Pct: 7.5%

## 7. Kill Criteria & Gate Validation Outcome
Gate-Decision: PASS
'@
          [System.IO.File]::WriteAllText((Join-Path $mockDir "docs/pm/M00_LITE.md"), $mockContent, [System.Text.Encoding]::UTF8)
          Push-Location $mockDir
          try {
            & "$env:GITHUB_WORKSPACE\scripts\gates\validate-gate.ps1" -Module M00
            if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { throw "Gate validation failed" }
          } finally {
            Pop-Location
          }
